# Local stack. `docker compose up -d db redis` is enough for `pnpm dev:api`.
# Full stack: `docker compose --profile app up --build`. Routing: `--profile osrm` (see infra/osrm/README.md).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ship
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ship"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/ship
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: http://localhost:4000
      OTP_DEV_ECHO: "true"
      OTP_DEV_FIXED_CODE: "123456"
      OTP_IP_HOURLY_LIMIT: "1000"
      CORS_ORIGINS: http://localhost:5173
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-haversine}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/scripts/seed.js && node dist/main.js"]

  osrm:
    profiles: ["osrm"]
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "1000", "/data/thailand-latest.osrm"]
    volumes: ["./infra/osrm/data:/data"]
    ports: ["5000:5000"]

volumes:
  pgdata:
  redisdata:
