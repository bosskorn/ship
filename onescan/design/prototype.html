<title>OneScan Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: review chrome (journey stepper + toggles) around one live phone, or a board of every screen in flow order. */
:root {
  /* Review page (follows the viewer's theme) */
  --page: #EEF1F5; --page-ink: #121722; --page-mute: #5B6475; --page-line: #D8DDE5; --page-chip: #FFFFFF; --page-accent: #0052D9;
  --font: Roboto, "Noto Sans Thai", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0E1116; --page-ink: #E7EBF1; --page-mute: #98A2B3; --page-line: #262D38; --page-chip: #181D25; --page-accent: #6EA0FF; color-scheme: dark } }
:root[data-theme="dark"] { --page: #0E1116; --page-ink: #E7EBF1; --page-mute: #98A2B3; --page-line: #262D38; --page-chip: #181D25; --page-accent: #6EA0FF; color-scheme: dark }

/* App (inside the phone): OneScan design system, light and a designed dark. */
.app { --bg: #FFFFFF; --surface: #F4F6F9; --surface2: #EBEEF3; --ink: #0F1521; --ink2: #586173; --ink3: #8A93A3; --line: #E3E7ED;
  --brand: #0052D9; --brand-ink: #FFFFFF; --tint: #E8F0FF; --tint-ink: #0046BA; --danger: #C62828; --ok: #1E7F4F; --scrim: rgba(15,21,33,.42);
  --paper: #FFFFFF; --paper-line: #C7CEDA; --paper-head: #2F5FD0; --desk: #3B3631; --shadow: 0 1px 2px rgba(15,21,33,.10); }
.app.dark { --bg: #121419; --surface: #1A1D24; --surface2: #232831; --ink: #E8EBF0; --ink2: #A3ABB9; --ink3: #737D8E; --line: #2A303A;
  --brand: #5B93FF; --brand-ink: #0B1220; --tint: #1D2A44; --tint-ink: #A9C6FF; --danger: #FF7B7B; --ok: #5BD08F; --scrim: rgba(0,0,0,.58);
  --paper: #F4F3EF; --paper-line: #C4C9D2; --paper-head: #3B66D4; --desk: #2A2724; --shadow: 0 1px 2px rgba(0,0,0,.5); }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--page); color: var(--page-ink); font-family: var(--font); margin: 0 }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; max-width: 1440px; margin: 0 auto }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em }
.sub { color: var(--page-mute); font-size: 13px; margin-top: 2px }
.controls { display: flex; flex-wrap: wrap; gap: 8px }
.seg { display: inline-flex; background: var(--page-chip); border: 1px solid var(--page-line); border-radius: 999px; padding: 3px }
.seg button { font: 500 13px var(--font); color: var(--page-mute); background: none; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--page-accent); color: #fff }
.seg button:focus-visible, .step:focus-visible { outline: 2px solid var(--page-accent); outline-offset: 2px }
.journey { display: flex; gap: 6px; margin: 16px 0 8px; overflow-x: auto; padding-bottom: 4px }
.step { flex: none; font: 500 13px var(--font); color: var(--page-ink); background: var(--page-chip); border: 1px solid var(--page-line); border-radius: 999px; padding: 7px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.step b { font-weight: 700; color: var(--page-mute); font-variant-numeric: tabular-nums }
.step[aria-current="true"] { border-color: var(--page-accent); color: var(--page-accent) }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 24px; align-items: start; margin-top: 12px }
@media (max-width: 820px) { .stage { grid-template-columns: minmax(0, 1fr) } }
.phone-slot { display: flex; justify-content: center; min-width: 0 }
.notes { background: var(--page-chip); border: 1px solid var(--page-line); border-radius: 14px; padding: 16px; font-size: 14px; line-height: 1.55; min-width: 0 }
.notes h2 { font-size: 15px; margin: 0 0 6px }
.notes p { margin: 0 0 10px; color: var(--page-mute) }
.notes ul { margin: 0; padding-left: 18px; color: var(--page-mute) }
.notes .hint { font-size: 12px; color: var(--page-mute); border-top: 1px solid var(--page-line); padding-top: 10px; margin-top: 12px }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px 16px; margin-top: 16px }
.board figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0 }
.board figcaption { font-size: 13px; font-weight: 500; text-align: center }
.board figcaption span { display: block; color: var(--page-mute); font-weight: 400; font-size: 12px }
.board .arrow { color: var(--page-mute) }

/* Phone frame (dp = CSS px; scaled to fit) */
.frame { position: relative; flex: none }
.device { position: absolute; top: 0; left: 0; transform-origin: top left; border-radius: 36px; overflow: hidden; box-shadow: 0 0 0 10px #1B1E24, 0 20px 50px rgba(0,0,0,.28) }
.app { width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; position: relative; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased }
:where(.app) :where(button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit }
.status { height: 28px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 13px; font-weight: 500; color: var(--ink) }
.status.on-dark { color: #fff }
.status .dots { display: flex; gap: 5px; align-items: center }
.gesture { height: 18px; flex: none; display: flex; justify-content: center; align-items: center }
.gesture i { width: 108px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .35 }
.body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; position: relative }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none }
.scroll::-webkit-scrollbar { display: none }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
svg.i.s20 { width: 20px; height: 20px }
svg.i.s18 { width: 18px; height: 18px }

.appbar { height: 64px; flex: none; display: flex; align-items: center; padding: 0 4px 0 16px; gap: 4px }
.appbar .title { flex: 1; min-width: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.appbar .title.small { font-size: 18px; font-weight: 500 }
.appbar.lead { padding-left: 4px }
.ib { width: 48px; height: 48px; border-radius: 24px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink) }
.ib:hover { background: var(--surface) }
.wordmark { font-size: 22px; font-weight: 700; letter-spacing: -.02em }
.wordmark em { font-style: normal; color: var(--brand) }

.sec { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 8px }
.sec h3 { margin: 0; font-size: 16px; font-weight: 600 }
.sec a, .link { color: var(--brand); font-size: 14px; font-weight: 500; cursor: pointer }
.label { padding: 20px 16px 8px; font-size: 13px; font-weight: 600; color: var(--ink2); letter-spacing: .01em }

.carousel { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scrollbar-width: none }
.carousel::-webkit-scrollbar { display: none }
.rc { flex: none; width: 128px; cursor: pointer }
.thumb { border-radius: 10px; border: 1px solid var(--line); background: var(--paper); overflow: hidden; display: block; box-shadow: var(--shadow) }
.thumb svg { display: block; width: 100%; height: 100% }
.rc .thumb { width: 128px; height: 170px }
.name { font-size: 14px; font-weight: 500; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.meta { font-size: 12px; color: var(--ink2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px }
.qa { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px; border-radius: 14px; background: var(--surface); cursor: pointer; font-weight: 500; min-width: 0 }
.qa span { line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.qa .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--tint); color: var(--tint-ink); display: flex; align-items: center; justify-content: center; flex: none }

.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 32px 16px; text-align: center; gap: 8px }
.empty h2 { margin: 12px 0 0; font-size: 20px; font-weight: 600 }
.empty p { margin: 0; color: var(--ink2); line-height: 1.5 }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: 24px; background: var(--brand); color: var(--brand-ink) !important; font-weight: 600 !important; font-size: 15px }
.btn.block { width: 100%; height: 52px; border-radius: 26px }
.btn.tonal { background: var(--tint); color: var(--tint-ink) !important }
.btn.text { background: none; color: var(--brand) !important; padding: 0 12px }
.pair { display: flex; gap: 8px; margin-top: 4px }

/* Bottom navigation */
.nav { flex: none; height: 72px; display: flex; background: var(--bg); border-top: 1px solid var(--line); position: relative }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: var(--ink2); cursor: pointer; min-width: 0 }
.tab .pill { width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center }
.tab.on { color: var(--ink); font-weight: 600 }
.tab.on .pill { background: var(--tint); color: var(--tint-ink) }
.tab.scan { color: var(--brand); font-weight: 600 }
.tab.scan .fab { width: 52px; height: 40px; border-radius: 16px; background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; justify-content: center }

/* Document grid / list */
.chips { display: flex; gap: 8px; padding: 4px 16px 12px; overflow-x: auto; scrollbar-width: none; flex: none }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); cursor: pointer; font-weight: 500 }
.chip.on { background: var(--tint); color: var(--tint-ink); border-color: transparent }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; padding: 0 16px 16px }
.gi { min-width: 0; cursor: pointer; position: relative }
.gi .thumb { width: 100%; aspect-ratio: 3 / 4 }
.gi .row { display: flex; align-items: flex-start; gap: 4px }
.gi .row > div { flex: 1; min-width: 0 }
.gi .more { width: 32px; height: 32px; margin-top: 4px; margin-right: -6px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--ink2) }
.check { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 13px; border: 2px solid #fff; background: rgba(15,21,33,.25); display: flex; align-items: center; justify-content: center; color: #fff }
.gi.sel .thumb { outline: 3px solid var(--brand); outline-offset: -1px }
.gi.sel .check { background: var(--brand); border-color: var(--brand) }
.li { display: flex; gap: 14px; align-items: center; padding: 10px 4px 10px 16px; cursor: pointer }
.li .thumb { width: 48px; height: 62px; flex: none; border-radius: 6px }
.li > div { flex: 1; min-width: 0 }
.li .name { margin-top: 0 }
.hr { height: 1px; background: var(--line); margin-left: 78px }
.snack { position: absolute; left: 12px; right: 12px; bottom: 84px; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 0 8px 0 16px; height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.2) }
.snack b { color: var(--tint); font-weight: 600; padding: 8px }
.app.dark .snack b { color: #0046BA }

/* Sheets */
.scrim { position: absolute; inset: 0; background: var(--scrim); display: flex; flex-direction: column; justify-content: flex-end; z-index: 5 }
.sheet { background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 0 24px }
.handle { width: 32px; height: 4px; border-radius: 2px; background: var(--ink3); opacity: .5; margin: 4px auto 8px }
.sheet .sh-head { display: flex; gap: 12px; align-items: center; padding: 8px 24px 12px }
.sheet .sh-head .thumb { width: 36px; height: 46px; border-radius: 5px; flex: none }
.sheet .sh-title { font-size: 16px; font-weight: 600 }
.si { display: flex; align-items: center; gap: 18px; height: 56px; padding: 0 24px; cursor: pointer; font-size: 15px }
.si svg { color: var(--ink2) }
.si.danger, .si.danger svg { color: var(--danger) }
.share-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 8px 20px 4px }
.share-row div { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; text-align: center; color: var(--ink2) }
.share-row i { width: 56px; height: 56px; border-radius: 28px; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--ink) }

/* Settings */
.set { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 8px 16px; cursor: pointer }
.set svg { color: var(--ink2) }
.set > div { flex: 1; min-width: 0 }
.set .t { font-size: 16px }
.set .v { font-size: 13px; color: var(--ink2); margin-top: 2px }

/* Tools */
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 8px }
.tool { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 4px 12px; border-radius: 16px; cursor: pointer; font-size: 13px; text-align: center; min-width: 0 }
.tool i { width: 56px; height: 56px; border-radius: 18px; background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center }
.tool.primary i { background: var(--tint); color: var(--tint-ink) }

/* Search */
.searchbar { margin: 8px 12px; height: 52px; border-radius: 26px; background: var(--surface); display: flex; align-items: center; gap: 4px; padding: 0 4px; flex: none }
.searchbar .q { flex: 1; font-size: 16px }
.searchbar .q::after { content: ""; display: inline-block; width: 2px; height: 20px; background: var(--brand); vertical-align: -4px; margin-left: 1px }
.sr { display: flex; gap: 14px; padding: 12px 16px; cursor: pointer }
.sr .thumb { width: 52px; height: 68px; flex: none; border-radius: 6px }
.sr > div { min-width: 0; flex: 1 }
.sr .snip { font-size: 13px; color: var(--ink2); margin-top: 4px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
mark { background: var(--tint); color: var(--tint-ink); border-radius: 3px; padding: 0 2px; font-weight: 600 }
.count { padding: 4px 16px 4px; font-size: 13px; color: var(--ink2) }

/* Camera + review */
.cam { background: #0B0C0E; color: #fff }
.cam .ib { color: #fff }
.cam .ib:hover { background: rgba(255,255,255,.08) }
.viewfinder { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--desk) }
.viewfinder svg { position: absolute; inset: 0; width: 100%; height: 100% }
.hintpill { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(0,0,0,.55); color: #fff; border-radius: 18px; padding: 8px 14px; font-size: 13px; white-space: nowrap }
.modes { display: flex; justify-content: center; gap: 22px; padding: 14px 0 8px; font-size: 14px; color: rgba(255,255,255,.62) }
.modes .on { color: #fff; font-weight: 600 }
.camctl { height: 112px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px }
.shutter { width: 76px; height: 76px; border-radius: 38px; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer }
.shutter i { width: 60px; height: 60px; border-radius: 30px; background: #fff; display: block }
.stack { width: 48px; height: 56px; position: relative; cursor: pointer }
.stack .thumb { position: absolute; width: 40px; height: 52px; border-radius: 5px; border: 2px solid #fff }
.stack b { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--brand); color: var(--brand-ink); font-size: 12px; display: flex; align-items: center; justify-content: center; padding: 0 5px }
.roundbtn { width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; color: #fff }
.review { background: var(--surface) }
.review .stagearea { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px 40px 12px }
.review .stagearea .thumb { width: 100%; max-width: 300px; aspect-ratio: 210 / 297; border-radius: 4px; box-shadow: 0 8px 28px rgba(15,21,33,.18) }
.pageno { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--ink2); background: var(--bg); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--line) }
.edits { display: flex; justify-content: space-around; padding: 6px 8px 2px; background: var(--bg) }
.edit { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--ink2); padding: 8px 10px; cursor: pointer; border-radius: 12px; min-width: 64px }
.edit svg { color: var(--ink) }
.strip { display: flex; gap: 10px; padding: 10px 16px; background: var(--bg); overflow-x: auto; scrollbar-width: none }
.strip .p { flex: none; width: 48px; height: 64px; border-radius: 6px; position: relative; cursor: pointer }
.strip .p .thumb { width: 100%; height: 100%; border-radius: 6px }
.strip .p.on .thumb { outline: 2.5px solid var(--brand); outline-offset: 1px }
.strip .p b { position: absolute; bottom: -2px; right: -2px; width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 11px; display: flex; align-items: center; justify-content: center }
.strip .add { flex: none; width: 48px; height: 64px; border-radius: 6px; border: 1.5px dashed var(--ink3); display: flex; align-items: center; justify-content: center; color: var(--ink2); cursor: pointer }
.savebar { padding: 8px 16px 12px; background: var(--bg) }

/* Viewer */
.viewer .pagewrap { flex: 1; min-height: 0; background: var(--surface); display: flex; align-items: center; justify-content: center; padding: 16px 36px; position: relative }
.viewer .pagewrap .thumb { width: 100%; aspect-ratio: 210 / 297; border-radius: 3px; box-shadow: 0 6px 22px rgba(15,21,33,.16) }
.actions4 { display: flex; justify-content: space-around; padding: 8px 4px; border-top: 1px solid var(--line) }

/* Onboarding */
.ob { flex: 1; display: flex; flex-direction: column; padding: 0 24px 16px }
.ob .vis { height: 44%; min-height: 300px; display: flex; align-items: center; justify-content: center; margin: 4px -8px 0; border-radius: 28px; background: var(--surface) }
.ob .vis svg { width: 100%; height: 100% }
.ob h2 { font-size: 28px; line-height: 1.25; margin: 28px 0 10px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance }
.ob p { color: var(--ink2); font-size: 16px; line-height: 1.55; margin: 0 }
.ob .bottom { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px }
.dotsrow { display: flex; gap: 6px }
.dotsrow i { width: 6px; height: 6px; border-radius: 3px; background: var(--line) }
.dotsrow i.on { width: 20px; background: var(--brand) }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px }
.tags span { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--surface); font-size: 13px; font-weight: 500 }
.tags svg { color: var(--ok) }

/* Picker sheet */
.pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 4px 20px 8px }
.pick div { min-width: 0; cursor: pointer }
.pick .thumb { width: 100%; aspect-ratio: 3 / 4; border-radius: 8px }
@media (prefers-reduced-motion: no-preference) { .scrim .sheet { animation: up .22s cubic-bezier(.2,.8,.2,1) } @keyframes up { from { transform: translateY(40px); opacity: .6 } } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>OneScan Prototype</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="controls" role="group" aria-label="Prototype options">
      <div class="seg" id="seg-mode"><button id="m-flow" data-mode="flow">Flow</button><button id="m-board" data-mode="board">All screens</button></div>
      <div class="seg" id="seg-lang"><button id="l-th" data-lang="th">ไทย</button><button id="l-en" data-lang="en">English</button></div>
      <div class="seg" id="seg-theme"><button id="t-light" data-scheme="light">Light</button><button id="t-dark" data-scheme="dark">Dark</button></div>
      <div class="seg" id="seg-w"><button id="w-412" data-w="412">412 dp</button><button id="w-360" data-w="360">360 dp</button></div>
    </div>
  </header>
  <nav class="journey" id="journey" aria-label="Journey"></nav>
  <main id="main"></main>
</div>

<script>
'use strict';
const S = { mode: 'flow', lang: 'th', scheme: 'light', w: 412, screen: 'ob1', sel: new Set(['d2', 'd4']) };
try { const saved = JSON.parse(localStorage.getItem('onescan-proto') || '{}'); Object.assign(S, { lang: saved.lang || S.lang, scheme: saved.scheme || S.scheme, w: saved.w || S.w, mode: saved.mode || S.mode }); } catch (e) {}
const H = 915;

/* ---------- copy ---------- */
const T = {
  th: {

  return Math.min(1, avail / H, wAvail / S.w);
}

function render() {
  const x = t();
  document.getElementById('sub').textContent = x.sub;
  for (const [g, key] of [['seg-mode', 'mode'], ['seg-lang', 'lang'], ['seg-theme', 'scheme'], ['seg-w', 'w']]) {
    for (const btn of document.getElementById(g).querySelectorAll('button')) btn.setAttribute('aria-pressed', String(btn.dataset[key === 'scheme' ? 'scheme' : key === 'w' ? 'w' : key] === String(S[key])));
  }
  const cur = screens[S.screen].j;
  document.getElementById('journey').innerHTML = x.j.map((name, i) => `<button class="step" data-jump="${journeyTargets[i]}" aria-current="${S.mode === 'flow' && i === cur}"><b>${i + 1}</b>${name}</button>`).join('');
  const main = document.getElementById('main');
  if (S.mode === 'flow') {
    const n = NOTES[S.screen];
    main.innerHTML = `<div class="stage"><div class="phone-slot">${device(S.screen, phoneScale())}</div><aside class="notes"><h2>${screens[S.screen].cap.join(' · ')}</h2><p><b style="color:var(--page-ink)">${n[0]}</b> ${n[1]}</p>
      <ul>${order.map((id) => `<li><a href="#${id}" data-jump="${id}" style="color:${id === S.screen ? 'var(--page-accent)' : 'inherit'}">${screens[id].cap.join(' · ')}</a></li>`).join('')}</ul>
      <div class="hint">Tap buttons inside the phone to move through the flow. Sample documents are examples.</div></aside></div>`;
  } else {
    main.innerHTML = `<div class="board">${order.map((id) => `<figure>${device(id, 0.5)}<figcaption>${screens[id].cap[0]}<span>${screens[id].cap[1]}</span></figcaption></figure>`).join('')}</div>`;
  }
}
function save() { try { localStorage.setItem('onescan-proto', JSON.stringify({ lang: S.lang, scheme: S.scheme, w: S.w, mode: S.mode })); } catch (e) {} }

document.addEventListener('click', (e) => {
  if (longPressed) { longPressed = false; return; }
  const seg = e.target.closest('.seg button');
  if (seg) {
    if (seg.dataset.mode) S.mode = seg.dataset.mode;
    if (seg.dataset.lang) S.lang = seg.dataset.lang;
    if (seg.dataset.scheme) S.scheme = seg.dataset.scheme;
    if (seg.dataset.w) S.w = Number(seg.dataset.w);
    save(); render(); return;
  }
  const jump = e.target.closest('[data-jump]');
  if (jump) { e.preventDefault(); S.screen = jump.dataset.jump; S.mode = 'flow'; save(); render(); return; }
  const app = e.target.closest('.app');
  if (!app || S.mode !== 'flow') { if (app && S.mode === 'board') { S.screen = app.dataset.screen; S.mode = 'flow'; render(); } return; }
  const tog = e.target.closest('[data-toggle]');
  if (tog) { const id = tog.dataset.toggle; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); return; }
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-go]')) return;
  const go = e.target.closest('[data-go]');
  if (go) { S.screen = go.dataset.go; render(); }
});
// Long press on a document in the grid starts selection, as on the phone.
let pressTimer = null;
let longPressed = false;
document.addEventListener('pointerdown', (e) => {

document.addEventListener('pointerup', () => clearTimeout(pressTimer));
