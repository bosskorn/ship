<!doctype html>
<!--
  Receipt Restore R2 — local corner / edge annotation for real receipt captures.
  Open this file directly in a browser (file://). Images never leave the computer: nothing is
  uploaded, there is no network code. Click the 4 corners (top-left, top-right, bottom-right,
  bottom-left), optionally click extra points along curved edges, then Save → <CODE>.corners.json
  next to the capture.
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Corner Annotator</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #5d6676; --accent: #1a56db; --line: #d0d5dd; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --fg: #e8ebf0; --muted: #9aa3b2; --accent: #6b9bff; --line: #333a45; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Noto Sans Thai", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  button, label.file { border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { color: var(--muted); min-width: 0; flex: 1 1 240px; }
  #wrap { padding: 16px; overflow: auto; }
  canvas { max-width: 100%; height: auto; cursor: crosshair; touch-action: none; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <label class="file">เปิดภาพ capture<input id="file" type="file" accept="image/*"></label>
  <button id="mode">โหมด: มุม 4 จุด</button>
  <button id="undo">ย้อน</button>
  <button id="clear">ล้าง</button>
  <button id="save" class="primary">บันทึก .corners.json</button>
  <span id="status">เปิดภาพ แล้วคลิกมุม: บนซ้าย → บนขวา → ล่างขวา → ล่างซ้าย</span>
</header>
<div id="wrap"><canvas id="c" width="10" height="10"></canvas></div>
<script>
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  let img = null, name = 'capture', corners = [], edge = [], edgeMode = false;
  const status = (t) => (document.getElementById('status').textContent = t);
  function draw() {
    if (!img) return;
    ctx.drawImage(img, 0, 0);
    const r = Math.max(6, img.width / 250);
    ctx.lineWidth = r / 2;
    ctx.strokeStyle = '#ff2d55';
    if (corners.length > 1) {
      ctx.beginPath();
      corners.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      if (corners.length === 4) ctx.closePath();
      ctx.stroke();
    }
    corners.forEach((p, i) => { ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = `${r * 2}px sans-serif`; ctx.fillText(String(i + 1), p[0] + r, p[1] - r); });
    edge.forEach((p) => { ctx.fillStyle = '#00c2ff'; ctx.beginPath(); ctx.arc(p[0], p[1], r * 0.7, 0, 7); ctx.fill(); });
  }
  document.getElementById('file').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    name = f.name.replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(f);
    img = new Image();
    img.onload = () => { c.width = img.width; c.height = img.height; corners = []; edge = []; draw(); status(`${f.name}: ${img.width}×${img.height} — คลิกมุมที่ 1 (บนซ้าย)`); };
    img.src = url;
  };
  c.addEventListener('pointerdown', (e) => {
    if (!img) return;
    const b = c.getBoundingClientRect();
    const p = [Math.round((e.clientX - b.left) * c.width / b.width), Math.round((e.clientY - b.top) * c.height / b.height)];
    if (!edgeMode && corners.length < 4) corners.push(p);
    else edge.push(p);
    draw();
    status(corners.length < 4 ? `มุมที่ ${corners.length + 1}` : `ครบ 4 มุม · จุดขอบโค้ง ${edge.length} จุด (กด "โหมด" เพื่อเพิ่ม)`);
  });
  document.getElementById('mode').onclick = () => { edgeMode = !edgeMode; document.getElementById('mode').textContent = edgeMode ? 'โหมด: จุดตามขอบโค้ง' : 'โหมด: มุม 4 จุด'; };
  document.getElementById('undo').onclick = () => { (edgeMode && edge.length ? edge : corners).pop(); draw(); };
  document.getElementById('clear').onclick = () => { corners = []; edge = []; draw(); };
  document.getElementById('save').onclick = () => {
    if (corners.length !== 4) return status('ต้องมีครบ 4 มุมก่อนบันทึก');
    // Boundary polyline: corners plus edge points ordered around the receipt's centre.
    const cx = corners.reduce((s, p) => s + p[0], 0) / 4, cy = corners.reduce((s, p) => s + p[1], 0) / 4;
    const all = [...corners, ...edge].sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
    const blob = new Blob([JSON.stringify({ corners, boundary: edge.length ? all : [] }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${name}.corners.json`;
    a.click();
    status(`บันทึก ${name}.corners.json แล้ว — วางไว้ข้างไฟล์ภาพ`);
  };
</script>
</body>
</html>
