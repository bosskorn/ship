plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.onescan.vision'
version = '1.0.0'

android {
  namespace "app.onescan.vision"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  // Tesseract language models are already compressed.
  androidResources {
    noCompress += ['traineddata']
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  def camerax = "1.6.2"
  implementation "androidx.camera:camera-core:${camerax}"
  implementation "androidx.camera:camera-camera2:${camerax}"
  implementation "androidx.camera:camera-lifecycle:${camerax}"
  implementation "androidx.camera:camera-view:${camerax}"
  implementation "androidx.exifinterface:exifinterface:1.4.2"
  // On-device OCR: ML Kit (Latin, bundled model) + Tesseract for Thai.
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "cz.adaptech.tesseract4android:tesseract4android:4.9.0"
  // System document scanner (edge detection, auto capture, crop) — on device via Play services.
  implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"

  testImplementation "junit:junit:4.13.2"
}
